title: "Bensari Workshop Woodworking Knowledge"
description: "Practice-based knowledge about traditional woodworking, cabinetmaking, furniture making and craft education from Tom Bensari and Bensari Workshop."
url: "https://tombensariworkshop-web.github.io"
baseurl: "/woodworking-knowledge"
lang: "en"
timezone: "Europe/Warsaw"
repository: "tombensariworkshop-web/woodworking-knowledge"

author:
  name: "Tom Bensari"
  url: "https://www.bensariworkshop.com/en/about-us/"

theme: jekyll-theme-primer

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - CONTENT-ARCHITECTURE.md
  - README.md
  - scripts

