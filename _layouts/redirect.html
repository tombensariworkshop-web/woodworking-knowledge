<!doctype html>
<html lang="{{ page.language | default: site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  </head>
  <body>
    {{ content }}
    <p><a href="{{ page.redirect_to | relative_url }}">Continue to the maintained article.</a></p>
  </body>
</html>
