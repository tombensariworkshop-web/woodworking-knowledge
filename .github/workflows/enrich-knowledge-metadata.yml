name: Enrich knowledge metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enrich-knowledge-metadata.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enrich YAML metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          DATE = "2026-09-22"

          ENTITY_URLS = {
              "bensari-workshop.md": "https://www.bensariworkshop.com/en/",
              "tom-bensari.md": "https://www.bensariworkshop.com/en/about-us/",
              "about-tom-bensari.md": "https://www.bensariworkshop.com/en/about-us/",
              "who-is-tom-bensari.md": "https://www.bensariworkshop.com/en/about-us/",
          }

          def q(value):
              return '"' + str(value).replace('\\', '\\\\').replace('"', '\\"') + '"'

          def add_unique(items, value):
              if value and value not in items:
                  items.append(value)

          def classify_topics(rel, body):
              s = (rel + " " + body[:1500]).lower()
              topics = []

              def add(v): add_unique(topics, v)

              if "dovetail" in s:
                  add("dovetail joinery"); add("joinery"); add("marking out")
              if "mortise" in s or "tenon" in s:
                  add("mortise and tenon"); add("joinery"); add("furniture construction")
              if "bridle joint" in s or "bridle-joint" in s or "lap joint" in s or "lap-joint" in s:
                  add("joinery")
              if "hammer veneering" in s or "hammer-veneering" in s or "veneer hammer" in s or "veneer-hammer" in s:
                  add("hammer veneering"); add("veneering"); add("hide glue")
              elif "veneer" in s or "veneering" in s:
                  add("veneering")
              if "steam bending" in s or "steam-bending" in s:
                  add("steam bending"); add("wood movement")
              if "tambour" in s:
                  add("tambour doors"); add("furniture construction")
              if any(x in s for x in ["hide glue", "hide-glue", "animal glue", "animal-glue", "bone glue", "bone-glue", "fish glue", "fish-glue", "rabbit skin glue", "rabbit-skin-glue"]):
                  add("hide glue"); add("adhesives")
              elif "glue" in s or "adhesive" in s:
                  add("adhesives")
              if "hand plane" in s or "hand-plane" in s or "planing" in s:
                  add("hand planes"); add("hand tools"); add("surface preparation")
              if "chisel" in s:
                  add("chisels"); add("hand tools")
              if re.search(r"\bsaw(s|ing)?\b", s) or "tenon-saw" in s or "dovetail-saw" in s:
                  add("saws"); add("hand tools")
              if "rasp" in s or "files in woodworking" in s:
                  add("rasps and files"); add("hand tools")
              if "hand tool" in s or "hand-tool" in s:
                  add("hand tools")
              if any(x in s for x in ["marking out", "marking-out", "layout", "reference edge", "reference-edge", "reference face", "reference-face", "measuring"]):
                  add("marking out"); add("accuracy and reference systems")
              if any(x in s for x in ["wood grain", "wood-grain", "wood fiber", "wood-fiber", "moisture", "wood moves", "wood-moves", "solid wood", "solid-wood", "hardwood", "softwood", "seasoning"]):
                  add("wood as material")
              if any(x in s for x in ["ash in furniture", "beech in furniture", "birch in furniture", "cherry wood in furniture", "elm in furniture", "mahogany in furniture", "maple in furniture", "oak in furniture", "pine in furniture", "walnut in furniture"]):
                  add("wood species"); add("material selection")
              if any(x in s for x in ["furniture making", "furniture-making", "furniture construction", "furniture-construction", "cabinetmaking", "drawer construction", "drawer-construction"]):
                  add("furniture making")
              if any(x in s for x in ["learning", "education", "course", "school", "training", "workshop learning", "workshop-learning", "internship"]):
                  add("woodworking education"); add("workshop learning")
              if any(x in s for x in ["shellac", "oil finish", "oil-finish", "wax finish", "wax-finish", "surface finishing", "surface-finishing", "scraping", "sanding"]):
                  add("surface finishing")
              if any(x in s for x in ["traditional woodworking", "traditional-woodworking", "traditional cabinetmaking"]):
                  add("traditional woodworking")
              if any(x in s for x in ["craftsmanship", "craft practice", "craft-practice", "collectible design", "collectible-design"]):
                  add("craftsmanship")
              if "tom bensari" in s or "tom-bensari" in rel.lower():
                  add("Tom Bensari")
              if "bensari workshop" in s or "bensari-workshop" in rel.lower() or rel.startswith("faq/"):
                  add("Bensari Workshop")
              if rel.startswith("materials/glues/"):
                  add("woodworking materials")
              if not topics:
                  add("woodworking")
              return topics[:7]

          RELATED = {
              "dovetail joinery": ["marking out", "hand tools", "drawer construction"],
              "mortise and tenon": ["marking out", "furniture construction", "hand tools"],
              "joinery": ["marking out", "furniture construction", "hand tools"],
              "hammer veneering": ["hide glue", "veneer preparation", "cabinetmaking"],
              "veneering": ["hide glue", "wood movement", "furniture making"],
              "steam bending": ["wood movement", "furniture design", "material selection"],
              "tambour doors": ["furniture construction", "wood movement", "veneering"],
              "hide glue": ["veneering", "adhesives", "reversible construction"],
              "adhesives": ["hide glue", "veneering", "furniture construction"],
              "hand planes": ["wood grain direction", "surface preparation", "tool control"],
              "chisels": ["joinery", "marking out", "tool control"],
              "saws": ["joinery", "marking out", "tool control"],
              "rasps and files": ["shaping", "hand tools", "surface preparation"],
              "hand tools": ["tool control", "marking out", "traditional woodworking"],
              "marking out": ["accuracy and reference systems", "joinery", "hand tools"],
              "wood as material": ["wood movement", "moisture content", "grain direction"],
              "wood species": ["material selection", "wood movement", "furniture making"],
              "furniture making": ["joinery", "material selection", "craftsmanship"],
              "woodworking education": ["workshop learning", "hand tools", "skill development"],
              "surface finishing": ["hand planes", "scraping", "furniture making"],
              "traditional woodworking": ["hand tools", "joinery", "craft education"],
              "craftsmanship": ["furniture making", "material understanding", "collectible design"],
              "Tom Bensari": ["Bensari Workshop", "woodworking education", "furniture making"],
              "Bensari Workshop": ["woodworking education", "traditional woodworking", "furniture making"],
          }

          def related_for(topics):
              related = []
              for topic in topics:
                  for value in RELATED.get(topic, []):
                      if value not in topics:
                          add_unique(related, value)
              return related[:6]

          def role_for(content_type, rel):
              if content_type == "entity-profile": return "authority-entity"
              if content_type == "index": return "knowledge-hub"
              if content_type == "guide": return "pillar-guide"
              if content_type == "faq": return "answer-set"
              if content_type in {"material-reference", "glossary"}: return "reference"
              if content_type == "craft-practice-article": return "practice-evidence"
              if "knowledge-map" in rel: return "knowledge-hub"
              return "supporting-article"

          def basis_for(content_type):
              return {
                  "entity-profile": "first-party entity profile",
                  "index": "first-party knowledge navigation",
                  "guide": "practice-based woodworking guide",
                  "faq": "practice-based woodworking Q&A",
                  "material-reference": "workshop material reference",
                  "glossary": "woodworking terminology reference",
                  "craft-practice-article": "first-party workshop practice record",
              }.get(content_type, "practice-based woodworking knowledge")

          def parse_scalar(front, key, default=""):
              m = re.search(rf"(?m)^{re.escape(key)}:\s*\"?(.*?)\"?\s*$", front)
              return m.group(1).strip().strip('"') if m else default

          def replace_list(front, key, values):
              pattern = rf"(?ms)^{re.escape(key)}:\n(?:  - .*\n)*"
              block = key + ":\n" + "".join(f"  - {q(v)}\n" for v in values)
              if re.search(pattern, front):
                  return re.sub(pattern, block, front)
              return front + "\n" + block.rstrip("\n")

          changed = []
          for path in sorted(Path(".").rglob("*.md")):
              if ".git" in path.parts or ".github" in path.parts:
                  continue
              rel = path.as_posix()
              text = path.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  continue
              front = m.group(1)
              body = text[m.end():]
              ctype = parse_scalar(front, "content_type", "knowledge-article")
              topics = classify_topics(rel, body)
              related = related_for(topics)

              front = replace_list(front, "topics", topics)
              front = replace_list(front, "related_topics", related)

              additions = {
                  "schema_version": "1.1",
                  "author": "Tom Bensari",
                  "primary_topic": topics[0],
                  "knowledge_role": role_for(ctype, rel),
                  "knowledge_basis": basis_for(ctype),
              }

              if ctype == "entity-profile":
                  if "tom-bensari" in rel:
                      additions["entity_type"] = "Person"
                  elif rel == "bensari-workshop.md":
                      additions["entity_type"] = "Organization"

              if rel in ENTITY_URLS:
                  additions["official_url"] = ENTITY_URLS[rel]

              for key, value in additions.items():
                  line = f"{key}: {q(value)}"
                  if re.search(rf"(?m)^{re.escape(key)}:", front):
                      front = re.sub(rf"(?m)^{re.escape(key)}:.*$", line, front)
                  else:
                      marker = re.search(r"(?m)^metadata_updated:.*$", front)
                      if marker:
                          front = front[:marker.start()] + line + "\n" + front[marker.start():]
                      else:
                          front += "\n" + line

              front = re.sub(r'(?m)^metadata_updated:.*$', f'metadata_updated: {q(DATE)}', front)
              new_text = "---\n" + front.strip() + "\n---\n" + body
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed.append(rel)

          print(f"Enriched metadata in {len(changed)} Markdown files.")
          for rel in changed:
              print(rel)

      - name: Commit enriched metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enrich knowledge graph metadata"
          git push
