name: Enrich knowledge metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enrich-knowledge-metadata.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refine funding FAQ metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("faq/woodworking-training-funding-poland-bur-kfs-reconversion-faq.md")
          text = path.read_text(encoding="utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m:
              raise SystemExit("Missing YAML frontmatter")

          front = m.group(1)
          body = text[m.end():]

          values = {
              "primary_topic": "woodworking training funding in Poland",
              "knowledge_role": "answer-set",
              "knowledge_basis": "first-party training provider FAQ with official programme references",
          }

          for key, value in values.items():
              line = f'{key}: "{value}"'
              if re.search(rf"(?m)^{re.escape(key)}:", front):
                  front = re.sub(rf"(?m)^{re.escape(key)}:.*$", line, front)
              else:
                  front += "\n" + line

          def replace_list(key, items):
              nonlocal_front = None
              pattern = rf"(?ms)^{re.escape(key)}:\n(?:  - .*\n)*"
              block = key + ":\n" + "".join(f'  - "{x}"\n' for x in items)
              return re.sub(pattern, block, front) if re.search(pattern, front) else front + "\n" + block.rstrip()

          topics = [
              "woodworking training funding in Poland",
              "Baza Usług Rozwojowych (BUR)",
              "Krajowy Fundusz Szkoleniowy (KFS)",
              "military reconversion funding",
              "vocational retraining",
              "adult skills funding",
              "Bensari Workshop",
          ]
          related = [
              "woodworking education",
              "professional development",
              "public funding for training",
              "career change",
              "craft qualifications in Poland",
              "training provider eligibility",
          ]

          pattern = r"(?ms)^topics:\n(?:  - .*\n)*"
          block = "topics:\n" + "".join(f'  - "{x}"\n' for x in topics)
          front = re.sub(pattern, block, front)

          pattern = r"(?ms)^related_topics:\n(?:  - .*\n)*"
          block = "related_topics:\n" + "".join(f'  - "{x}"\n' for x in related)
          front = re.sub(pattern, block, front)

          path.write_text("---\n" + front.strip() + "\n---\n" + body, encoding="utf-8")

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faq/woodworking-training-funding-poland-bur-kfs-reconversion-faq.md
          git commit -m "Refine funding FAQ metadata"
          git push
