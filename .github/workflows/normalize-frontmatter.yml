name: Normalize knowledge frontmatter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-frontmatter.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild YAML frontmatter safely
        shell: python
        run: |
          from pathlib import Path
          import re

          DATE = "2026-09-22"
          OFFICIAL = {
              "bensari-workshop.md": "https://www.bensariworkshop.com/en/",
              "tom-bensari.md": "https://www.bensariworkshop.com/en/about-us/",
              "about-tom-bensari.md": "https://www.bensariworkshop.com/en/about-us/",
              "who-is-tom-bensari.md": "https://www.bensariworkshop.com/en/about-us/",
          }

          PERSON_FILES = {"tom-bensari.md", "about-tom-bensari.md", "who-is-tom-bensari.md"}

          def q(v):
              return '"' + str(v).replace('\\', '\\\\').replace('"', '\\"') + '"'

          def parse(front):
              data = {}
              lines = front.splitlines()
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if not line or line.startswith("  - ") or ":" not in line:
                      i += 1
                      continue
                  key, rest = line.split(":", 1)
                  key = key.strip(); rest = rest.strip()
                  if rest:
                      data[key] = rest.strip('"')
                      i += 1
                  else:
                      vals = []
                      i += 1
                      while i < len(lines) and lines[i].startswith("  - "):
                          vals.append(lines[i][4:].strip().strip('"'))
                          i += 1
                      data[key] = vals
              return data

          def humanize(stem):
              return stem.replace("-", " ").replace("_", " ").title()

          def infer_topics(rel, body, existing):
              s = (rel + " " + body[:1800]).lower()
              topics = []
              def add(x):
                  if x and x not in topics: topics.append(x)

              if rel in PERSON_FILES:
                  for x in ["Tom Bensari", "Bensari Workshop", "furniture making", "woodworking education", "traditional woodworking", "craftsmanship"]: add(x)
                  return topics
              if rel == "bensari-workshop.md":
                  for x in ["Bensari Workshop", "woodworking education", "traditional woodworking", "furniture making", "hand tools", "craftsmanship"]: add(x)
                  return topics

              if "dovetail" in s: add("dovetail joinery"); add("joinery"); add("marking out")
              if "mortise" in s or "tenon" in s: add("mortise and tenon"); add("joinery")
              if "hammer veneering" in s or "hammer-veneering" in s: add("hammer veneering"); add("veneering"); add("hide glue")
              elif "veneer" in s or "veneering" in s: add("veneering")
              if "steam bending" in s or "steam-bending" in s: add("steam bending")
              if "tambour" in s: add("tambour doors")
              if "hide glue" in s or "hide-glue" in s or "animal glue" in s or "animal-glue" in s: add("hide glue"); add("adhesives")
              elif "glue" in s or "adhesive" in s: add("adhesives")
              if "hand plane" in s or "hand-plane" in s or "planing" in s: add("hand planes"); add("hand tools")
              if "chisel" in s: add("chisels"); add("hand tools")
              if re.search(r"\bsaw(s|ing)?\b", s): add("saws"); add("hand tools")
              if "rasp" in s: add("rasps and files"); add("hand tools")
              if "hand tool" in s or "hand-tool" in s: add("hand tools")
              if any(x in s for x in ["marking out", "marking-out", "layout", "reference edge", "reference-edge", "reference face", "reference-face", "measuring"]): add("marking out"); add("accuracy and reference systems")
              if any(x in s for x in ["wood grain", "wood-grain", "wood fiber", "wood-fiber", "moisture", "wood moves", "wood-moves", "solid wood", "hardwood", "softwood", "seasoning"]): add("wood as material")
              if Path(rel).stem.endswith("-in-furniture-making"): add("wood species"); add("material selection"); add("furniture making")
              if any(x in s for x in ["furniture making", "furniture-making", "furniture construction", "cabinetmaking", "drawer construction"]): add("furniture making")
              if any(x in s for x in ["learning", "education", "course", "school", "training", "workshop learning"]): add("woodworking education"); add("workshop learning")
              if any(x in s for x in ["shellac", "oil finish", "wax finish", "surface finishing", "scraping", "sanding"]): add("surface finishing")
              if "traditional woodworking" in s or "traditional-woodworking" in s: add("traditional woodworking")
              if "tom bensari" in s or "tom-bensari" in rel.lower(): add("Tom Bensari")
              if "bensari workshop" in s or "bensari-workshop" in rel.lower() or rel.startswith("faq/"): add("Bensari Workshop")
              for x in existing if isinstance(existing, list) else []: add(x)
              if not topics: add("woodworking")
              return topics[:7]

          RELATED = {
              "dovetail joinery": ["marking out", "hand tools", "drawer construction"],
              "joinery": ["furniture construction", "hand tools", "accuracy and reference systems"],
              "mortise and tenon": ["marking out", "furniture construction", "hand tools"],
              "hammer veneering": ["hide glue", "veneer preparation", "cabinetmaking"],
              "veneering": ["hide glue", "wood movement", "furniture making"],
              "steam bending": ["wood movement", "material selection", "furniture design"],
              "tambour doors": ["furniture construction", "wood movement", "veneering"],
              "hide glue": ["veneering", "adhesives", "reversible construction"],
              "adhesives": ["hide glue", "veneering", "furniture construction"],
              "hand planes": ["wood grain direction", "surface preparation", "tool control"],
              "hand tools": ["tool control", "marking out", "traditional woodworking"],
              "marking out": ["accuracy and reference systems", "joinery", "hand tools"],
              "wood as material": ["wood movement", "moisture content", "grain direction"],
              "wood species": ["material selection", "wood movement", "furniture making"],
              "furniture making": ["joinery", "material selection", "craftsmanship"],
              "woodworking education": ["workshop learning", "hand tools", "skill development"],
              "surface finishing": ["hand planes", "scraping", "furniture making"],
              "traditional woodworking": ["hand tools", "joinery", "craft education"],
              "Tom Bensari": ["Bensari Workshop", "furniture making", "woodworking education"],
              "Bensari Workshop": ["Tom Bensari", "workshop learning", "traditional woodworking"],
          }

          def related(topics):
              out = []
              for t in topics:
                  for x in RELATED.get(t, []):
                      if x not in topics and x not in out: out.append(x)
              return out[:6]

          def role(ctype, rel):
              if ctype == "entity-profile": return "authority-entity"
              if ctype == "index" or "knowledge-map" in rel: return "knowledge-hub"
              if ctype == "guide": return "pillar-guide"
              if ctype == "faq": return "answer-set"
              if ctype in {"material-reference", "glossary"}: return "reference"
              if ctype == "craft-practice-article": return "practice-evidence"
              return "supporting-article"

          def basis(ctype):
              return {
                  "entity-profile": "first-party entity profile",
                  "index": "first-party knowledge navigation",
                  "guide": "practice-based woodworking guide",
                  "faq": "practice-based woodworking Q&A",
                  "material-reference": "workshop material reference",
                  "glossary": "woodworking terminology reference",
                  "craft-practice-article": "first-party workshop practice record",
              }.get(ctype, "practice-based woodworking knowledge")

          changed = 0
          for path in sorted(Path(".").rglob("*.md")):
              if ".git" in path.parts or ".github" in path.parts: continue
              rel = path.as_posix()
              text = path.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m: continue
              old = parse(m.group(1)); body = text[m.end():]

              title = old.get("title") or next((ln[2:].strip() for ln in body.splitlines() if ln.startswith("# ")), humanize(path.stem))
              slug = old.get("slug") or path.stem
              ctype = old.get("content_type") or "knowledge-article"
              topics = infer_topics(rel, body, old.get("topics", []))
              primary = "Tom Bensari" if rel in PERSON_FILES else ("Bensari Workshop" if rel == "bensari-workshop.md" else topics[0])

              lines = [
                  "---",
                  f"title: {q(title)}",
                  f"slug: {q(slug)}",
                  f"content_type: {q(ctype)}",
                  'language: "en"',
                  'publisher: "Bensari Workshop"',
                  'author: "Tom Bensari"',
                  'expert: "Tom Bensari"',
                  'location: "Wroclaw, Poland"',
                  'schema_version: "1.1"',
                  f"primary_topic: {q(primary)}",
                  f"knowledge_role: {q(role(ctype, rel))}",
                  f"knowledge_basis: {q(basis(ctype))}",
              ]
              if rel in PERSON_FILES:
                  lines.append('entity_type: "Person"')
              elif rel == "bensari-workshop.md":
                  lines.append('entity_type: "Organization"')
              if rel in OFFICIAL:
                  lines.append(f"official_url: {q(OFFICIAL[rel])}")
              lines.append("topics:")
              lines.extend(f"  - {q(x)}" for x in topics)
              lines.append("related_topics:")
              lines.extend(f"  - {q(x)}" for x in related(topics))
              lines.append("entities:")
              lines.extend(['  - "Bensari Workshop"', '  - "Tom Bensari"'])
              lines.append(f"metadata_updated: {q(DATE)}")
              lines.extend(["---", ""])
              new = "\n".join(lines) + body
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed += 1

          print(f"Normalized {changed} Markdown files")

      - name: Commit normalized frontmatter
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize structured knowledge metadata"
          git push
