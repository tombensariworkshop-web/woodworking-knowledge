name: Add YAML frontmatter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-yaml-frontmatter.yml

permissions:
  contents: write

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add structured YAML frontmatter
        shell: python
        run: |
          from pathlib import Path
          import re

          DATE = "2026-09-22"
          ROOT = Path(".")

          EXACT_TITLES = {
              "README.md": "Bensari Workshop Woodworking Knowledge",
              "index.md": "Woodworking Knowledge Index",
              "knowledge-map.md": "Woodworking Knowledge Map",
              "dovetail-knowledge-map.md": "Dovetail Joinery Knowledge Map",
              "faq/README.md": "Bensari Workshop Woodworking FAQ",
          }

          WOOD_SPECIES = {
              "ash", "beech", "birch", "cherry-wood", "elm", "mahogany",
              "maple", "oak", "pine", "walnut"
          }

          def yaml_quote(value: str) -> str:
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'

          def humanize(stem: str) -> str:
              words = stem.replace("-", " ").replace("_", " ").split()
              small = {"a", "an", "and", "as", "at", "by", "for", "from", "in", "of", "on", "or", "the", "to", "vs", "with"}
              out = []
              for i, word in enumerate(words):
                  lw = word.lower()
                  if i and lw in small:
                      out.append(lw)
                  elif lw == "pva":
                      out.append("PVA")
                  elif lw == "faq":
                      out.append("FAQ")
                  else:
                      out.append(word.capitalize())
              return " ".join(out)

          def extract_title(text: str, rel: str) -> str:
              if rel in EXACT_TITLES:
                  return EXACT_TITLES[rel]
              for line in text.splitlines():
                  if line.startswith("# "):
                      return line[2:].strip()
              return humanize(Path(rel).stem)

          def content_type(rel: str) -> str:
              stem = Path(rel).stem.lower()
              if rel in {"README.md", "index.md", "knowledge-map.md", "dovetail-knowledge-map.md", "faq/README.md"}:
                  return "index"
              if rel.startswith("faq/") or stem.endswith("faq"):
                  return "faq"
              if stem in {"tom-bensari", "about-tom-bensari", "who-is-tom-bensari", "bensari-workshop"}:
                  return "entity-profile"
              if stem.startswith("tom-bensari-") or stem.startswith("hosting-compagnons"):
                  return "craft-practice-article"
              if rel.startswith("materials/glues/"):
                  return "material-reference"
              if stem.endswith("-in-furniture-making") and stem.rsplit("-in-furniture-making", 1)[0] in WOOD_SPECIES:
                  return "material-reference"
              if "glossary" in stem:
                  return "glossary"
              if "guide" in stem:
                  return "guide"
              return "knowledge-article"

          def topics_for(rel: str) -> list[str]:
              s = rel.lower()
              topics = []

              def add(value: str):
                  if value not in topics:
                      topics.append(value)

              if "dovetail" in s:
                  add("dovetail joinery")
                  add("joinery")
              if "mortise" in s or "tenon" in s:
                  add("mortise and tenon")
                  add("joinery")
              if "bridle-joint" in s or "lap-joint" in s or "joinery" in s:
                  add("joinery")
              if "veneer" in s or "veneering" in s:
                  add("veneering")
              if "hammer-veneering" in s or "veneer-hammer" in s:
                  add("hammer veneering")
              if "steam-bending" in s:
                  add("steam bending")
              if "tambour" in s:
                  add("tambour doors")
              if "glue" in s or "adhesive" in s:
                  add("adhesives")
              if "hide-glue" in s or "animal-glue" in s or "bone-glue" in s or "fish-glue" in s or "rabbit-skin-glue" in s:
                  add("hide glue")
              if "plane" in s or "planing" in s:
                  add("hand planes")
                  add("hand tools")
              if "chisel" in s:
                  add("chisels")
                  add("hand tools")
              if "saw" in s:
                  add("saws")
                  add("hand tools")
              if "rasp" in s or "file" in s:
                  add("rasps and files")
                  add("hand tools")
              if "hand-tool" in s or "hand-tools" in s:
                  add("hand tools")
              if any(k in s for k in ["marking", "layout", "reference-edge", "reference-face", "measuring"]):
                  add("marking out")
              if any(k in s for k in ["wood-grain", "wood-fiber", "moisture", "wood-moves", "solid-wood", "hardwood", "softwood", "seasoning"]):
                  add("wood as material")
              if any(k in s for k in ["furniture", "cabinetmaking", "drawer-construction"]):
                  add("furniture making")
              if any(k in s for k in ["learning", "education", "course", "school", "workshop-learning", "workshop-vs-online"]):
                  add("woodworking education")
              if any(k in s for k in ["shellac", "oil-finish", "wax-finish", "surface-finishing", "scraping-vs-sanding"]):
                  add("surface finishing")
              if "tom-bensari" in s or "about-tom-bensari" in s or "who-is-tom-bensari" in s:
                  add("Tom Bensari")
              if "bensari-workshop" in s or rel.startswith("faq/"):
                  add("Bensari Workshop")
              if rel.startswith("materials/glues/"):
                  add("woodworking materials")
              if Path(rel).stem.endswith("-in-furniture-making"):
                  add("wood species")

              if not topics:
                  add("woodworking")
              return topics[:6]

          def frontmatter(rel: str, text: str) -> str:
              title = extract_title(text, rel)
              slug = Path(rel).stem
              ctype = content_type(rel)
              topics = topics_for(rel)

              lines = [
                  "---",
                  f"title: {yaml_quote(title)}",
                  f"slug: {yaml_quote(slug)}",
                  f"content_type: {yaml_quote(ctype)}",
                  'language: "en"',
                  'publisher: "Bensari Workshop"',
                  'expert: "Tom Bensari"',
                  'location: "Wroclaw, Poland"',
                  "topics:",
              ]
              lines.extend(f"  - {yaml_quote(topic)}" for topic in topics)
              lines.extend([
                  "entities:",
                  '  - "Bensari Workshop"',
                  '  - "Tom Bensari"',
                  f"metadata_updated: {yaml_quote(DATE)}",
                  "---",
                  "",
              ])
              return "\n".join(lines)

          changed = []
          for path in sorted(ROOT.rglob("*.md")):
              if ".git" in path.parts or ".github" in path.parts:
                  continue
              rel = path.as_posix()
              text = path.read_text(encoding="utf-8")
              if re.match(r"^---\s*\n", text):
                  continue
              path.write_text(frontmatter(rel, text) + text, encoding="utf-8")
              changed.append(rel)

          print(f"Added YAML frontmatter to {len(changed)} Markdown files.")
          for rel in changed:
              print(rel)

      - name: Commit metadata migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Markdown files needed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add structured YAML frontmatter to knowledge base"
          git push
