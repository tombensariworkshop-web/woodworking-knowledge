<link rel="describedby" href="{{ '/llms.txt' | relative_url }}" type="text/markdown">
{% if page.path %}
<link rel="alternate" type="text/markdown" href="https://raw.githubusercontent.com/tombensariworkshop-web/woodworking-knowledge/main/{{ page.path }}">
{% endif %}

{% if page.content_type == "entity-profile" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": {{ page.url | absolute_url | jsonify }},
  "inLanguage": {{ page.language | jsonify }},
  "dateModified": {{ page.last_modified_at | date: '%Y-%m-%d' | jsonify }},
  "mainEntity": {
    "@type": {{ page.entity_type | jsonify }},
    "@id": {{ page.official_url | append: '#entity' | jsonify }},
    "name": {{ page.entity_name | jsonify }},
    "url": {{ page.official_url | jsonify }}{% if page.entity_type == "Person" %},
    "jobTitle": ["Designer", "Master woodworker", "Woodworking educator"]{% else %},
    "founder": {
      "@type": "Person",
      "@id": "https://www.bensariworkshop.com/en/about-us/#entity",
      "name": "Tom Bensari",
      "url": {{ '/tom-bensari.html' | absolute_url | jsonify }}
    }{% endif %}{% if page.same_as %},
    "sameAs": {{ page.same_as | jsonify }}{% endif %}
  }
}
</script>
{% elsif page.content_type and page.content_type != "index" and page.content_type != "redirect" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
  "inLanguage": {{ page.language | jsonify }},
  "about": {"@type": "Thing", "name": {{ page.primary_topic | jsonify }}},
  "dateModified": {{ page.last_modified_at | date: '%Y-%m-%d' | jsonify }},
  "author": {
    "@type": "Person",
    "@id": "https://www.bensariworkshop.com/en/about-us/#entity",
    "name": "Tom Bensari",
    "url": {{ '/tom-bensari.html' | absolute_url | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "@id": "https://www.bensariworkshop.com/en/#entity",
    "name": "Bensari Workshop",
    "url": "https://www.bensariworkshop.com/en/"
  }
}
</script>
{% endif %}
